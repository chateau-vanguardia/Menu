:root{--bg:#f6f4ef;--card:#fdfcf9;--ink:#4a2f28;--text:#6b6058;--line:#d9d5cc;--chip:#5f5d5a;--gold:#a8895a}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Glacial Indifference",system-ui,sans-serif;font-weight:400;line-height:1.23;overflow-x:hidden}
.arc{position:absolute;top:-10px;width:140px;height:140px;border:1px solid var(--line);border-radius:50%;pointer-events:none}
.arc.l{left:-95px}.arc.r{right:-95px}
header{position:relative;text-align:center;padding:36px 16px 24px;overflow:hidden}
.brand{font-size:.62rem;letter-spacing:.35em;text-transform:uppercase;color:var(--text)}
h1{font-family:"Brown Sugar",Georgia,serif;font-weight:400;color:var(--ink);font-size:clamp(4.2rem,16vw,7.5rem);line-height:1;margin:.15em 0 .1em;letter-spacing:.02em}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--gold);margin:6px 0}
.orn i{display:block;width:34px;height:1px;background:var(--gold)}
.orn span{width:7px;height:7px;border:1px solid var(--gold);transform:rotate(45deg)}
.sub{font-size:.9rem;letter-spacing:.08em;margin:6px 0 4px}
.note{font-size:.86rem;color:var(--text);opacity:.85;margin:0}
nav{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 16px;scrollbar-width:thin;max-width:1100px;margin:0 auto}
.chip{flex:none;font:inherit;font-size:.82rem;letter-spacing:.03em;border:1px solid var(--line);background:transparent;color:var(--text);padding:7px 15px;border-radius:999px;cursor:pointer;transition:.2s}
.chip:hover{border-color:var(--chip)}
.chip.on{background:var(--chip);border-color:var(--chip);color:#fff;font-weight:700}
main{max-width:760px;margin:0 auto;padding:10px 20px 20px}
section{margin-top:40px}
.sec-h{display:flex;align-items:flex-start;justify-content:space-between;border-bottom:0;margin-bottom:6px}
h2{font-family:"Brown Sugar",Georgia,serif;font-weight:400;font-size:clamp(1.9rem,6vw,2.6rem);letter-spacing:.04em;color:var(--ink);text-transform:uppercase;margin:0;line-height:1.1}
.star{color:#9aa0ad;font-size:1.1rem;margin-top:8px}
.rule{width:46px;height:1px;background:var(--ink);opacity:.45;margin:10px 0 14px}
.intro{font-size:.95rem;margin:0 0 14px;max-width:560px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border:1px solid var(--line);padding:16px 17px 14px;display:flex;flex-direction:column}
.card:before{content:"";width:16px;height:1px;background:var(--ink);opacity:.6;margin-bottom:14px}
.card h3{margin:0 0 8px;font-weight:700;font-size:.88rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink)}
.card p{margin:0 0 14px;font-size:.9rem;flex:1}
.price{border-top:1px solid var(--line);padding-top:10px;font-weight:700;font-size:.9rem;color:var(--ink);letter-spacing:.04em}
.price small{display:block;font-weight:400;font-size:.78rem;color:var(--text);letter-spacing:0}
.price span+span{margin-left:12px}
.list{background:var(--card);border:1px solid var(--line);padding:6px 18px}
.row{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--line);font-size:.93rem}
.row:last-child{border-bottom:0}
.row b{font-weight:700;color:var(--ink);white-space:nowrap}
.grp{font-weight:700;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);padding:14px 0 2px}
.grp:first-child{padding-top:8px}
.hide{display:none}
.top{display:block;width:max-content;margin:36px auto 0;color:var(--text);font-size:.78rem;letter-spacing:.1em;text-decoration:none}
footer{margin-top:40px;text-align:center;padding:30px 16px 44px;border-top:1px solid var(--line);font-size:.78rem}
footer .nm{text-transform:uppercase;font-family:"Brown Sugar",Georgia,serif;font-size:1.5rem;color:var(--ink);letter-spacing:.06em;margin-bottom:6px}
footer a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
footer div{margin:4px 0}
.wa{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:20;display:flex;align-items:center;gap:9px;background:#25a05a;color:#fff;text-decoration:none;font-size:.85rem;font-weight:700;letter-spacing:.04em;padding:12px 18px 12px 14px;border-radius:999px;box-shadow:0 6px 18px rgba(74,47,40,.28);transition:transform .2s,box-shadow .2s}
.wa:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(74,47,40,.36)}
.wa svg{width:22px;height:22px;fill:#fff;flex:none}
@media (max-width:420px){.wa{padding:13px;}.wa span{display:none}}
@media (max-width:560px){.grid{grid-template-columns:1fr}.arc{width:100px;height:100px}}
</style>
</head>

/* ============ RENDER ============ */
var chips=document.getElementById("chips"),menu=document.getElementById("menu");
function chip(label,id){var b=document.createElement("button");b.className="chip";b.textContent=label;b.dataset.id=id;b.onclick=function(){show(id)};chips.appendChild(b)}
chip("Todas","all");
var html="";
MENU.forEach(function(c){
  chip(c.t,c.id);
  html+='<section id="'+c.id+'" data-cat="'+c.id+'"><div class="sec-h"><h2>'+c.t+'</h2><span class="star">✧</span></div><div class="rule"></div>';
  if(c.intro)html+='<p class="intro">'+c.intro+'</p>';
  if(c.type==="cards"){
    html+='<div class="grid">';
    c.items.forEach(function(i){
      var pr=i[2].map(function(p){return p[0]&&i[2].length===1?'<small>'+p[0]+'</small>'+p[1]:'<span>'+(p[0]?p[0]+' ':'')+p[1]+'</span>'}).join("");
      html+='<article class="card"><h3>'+i[0]+'</h3><p>'+i[1]+'</p><div class="price">'+pr+'</div></article>';
    });
    html+='</div>';
  }else if(c.type==="list"){
    html+='<div class="list">'+c.items.map(function(i){return '<div class="row"><span>'+i[0]+'</span><b>'+i[1]+'</b></div>'}).join("")+'</div>';
  }else{
    html+='<div class="list">'+c.groups.map(function(g){return '<div class="grp">'+g[0]+'</div>'+g[1].map(function(i){return '<div class="row"><span>'+i[0]+'</span><b>'+i[1]+'</b></div>'}).join("")}).join("")+'</div>';
  }
  html+='</section>';
});
html+='<a class="top" href="#">Volver arriba ↑</a>';
menu.innerHTML=html;

function show(id){
  document.querySelectorAll(".chip").forEach(function(b){
    var on=b.dataset.id===id;b.classList.toggle("on",on);
    if(on)b.scrollIntoView({inline:"center",block:"nearest",behavior:"smooth"});
  });
  document.querySelectorAll("section").forEach(function(s){s.classList.toggle("hide",id!=="all"&&s.dataset.cat!==id)});
  var y=document.querySelector("nav").offsetTop+document.querySelector("nav").offsetHeight;
  if(window.scrollY>y)window.scrollTo({top:y-1,behavior:"smooth"});
}
show("all");
